# xdg-desktop-portal-wlr's settings in a Dashi session, installed as
# /etc/xdg/xdg-desktop-portal-wlr/Dashi: the portal reads
# $XDG_CONFIG_HOME/xdg-desktop-portal-wlr/$XDG_CURRENT_DESKTOP first, then
# this one (dashi-session sets XDG_CURRENT_DESKTOP=Dashi), so other desktops
# on the machine keep their own. Screen sharing asks Dashi's picker, which
# shows every screen and window as a live picture (xdg-desktop-portal-wlr(5),
# "OUTPUT CHOOSER": a simple chooser prints "Monitor: <output>" or
# "Window: <toplevel identifier>").
[screencast]
chooser_type=simple
chooser_cmd=/usr/bin/dashi-share-picker
