# xdg-desktop-portal reads <XDG_CURRENT_DESKTOP>-portals.conf (dashi-session
# sets XDG_CURRENT_DESKTOP=Dashi) to decide which backends serve this desktop.
# Dashi has none of its own yet: GTK's portal answers file choosers, settings,
# and the rest, and the wlroots portal (xdg-desktop-portal-wlr, over
# dashi-comp's wlr-screencopy and PipeWire) does screen sharing and screenshots.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
