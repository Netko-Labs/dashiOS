# xdg-desktop-portal reads <XDG_CURRENT_DESKTOP>-portals.conf (dashi-session
# sets XDG_CURRENT_DESKTOP=Dashi) to decide which backends serve this desktop.
# Dashi's own (dashi.portal, packages/shell/apps/portal) draws every dialog:
# files, permissions, Open With, printing, keep-awake, accounts, web apps.
# The wlroots portal (xdg-desktop-portal-wlr, over dashi-comp's wlr-screencopy
# and PipeWire) does screen sharing and screenshots. Secrets are kept by
# Dashi's vault (dashi-secretd), with gnome-keyring as the fallback. Nothing is GTK's.
[preferred]
default=dashi
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
# Secrets: Dashi's vault (dashi-secretd's bridge), else gnome-keyring's.
org.freedesktop.impl.portal.Secret=dashi-secret;gnome-keyring
