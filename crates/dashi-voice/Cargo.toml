[package]
name = "dashi-voice"
version = "0.5.0"
description = "Dashi's voice: the microphone, speech to text (Parakeet), text to speech (Kokoro), the speaker"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# ONNX Runtime (MIT) through ort (MIT OR Apache-2.0), loaded at run time from
# the system's libonnxruntime (Fedora's onnxruntime package), not bundled.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
