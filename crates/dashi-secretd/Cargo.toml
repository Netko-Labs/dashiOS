[package]
name = "dashi-secretd"
version = "0.4.1"
description = "Dashi's vault: secrets agents can use but never read"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "dashi-secretd"
path = "src/bin/dashi-secretd.rs"

[[bin]]
name = "dashi-secretd-pam"
path = "src/bin/dashi-secretd-pam.rs"

[[bin]]
name = "dashi-secret-bridge"
path = "src/bin/dashi-secret-bridge.rs"

[dependencies]
# Well-reviewed RustCrypto crates only: no cryptography of our own.
aes = "0.8"
ciborium = "0.2"
argon2 = { version = "0.5", features = ["zeroize"] }
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
libc = "0.2"
md-5 = "0.10"
num-bigint = "0.4"
p256 = { version = "0.13", features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
