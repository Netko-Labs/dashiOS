[package]
name = "dashi-comp"
version = "0.2.0"
description = "Dashi's Wayland compositor"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bitflags = "2"
calloop = { version = "0.14", features = ["signals"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cosmic-text = "0.14"
wayland-backend = "0.3"
wayland-protocols = { version = "0.32", features = ["server"] }
wayland-scanner = "0.31"
wayland-server = "0.31"
xcursor = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.smithay]
version = "0.7.0"
default-features = false
features = ["backend_drm", "backend_winit", "desktop", "renderer_gl", "wayland_frontend"]

[dev-dependencies]
tempfile = "3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "server"] }
