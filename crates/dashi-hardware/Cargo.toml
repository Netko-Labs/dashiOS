[package]
name = "dashi-hardware"
version = "0.4.0"
description = "Dashi's privileged hardware helper: firmware attributes, profiles, the charge limit, fans, the SMU"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["async-io"] }
