# Which kernel the boot loader starts by default (dashi-kernel). Applied
# after every kernel update, and now with: sudo /usr/libexec/dashi/default-kernel
#
#   auto     CachyOS's kernel when this machine can boot it (an x86-64-v3 CPU,
#            and Secure Boot off), Fedora's otherwise
#   cachyos  CachyOS's kernel (with Secure Boot on, only after its key is enrolled)
#   fedora   Fedora's kernel
#   keep     leave the default alone (grubby --set-default)
DEFAULT_KERNEL=auto
