# greetd runs Dashi's login screen (session/dashi-greeter) as Fedora's greetd
# user; it replaces dashi-sddm. The greeter starts the session the person
# picks (Dashi's by default) through greetd once PAM is satisfied.
[terminal]
vt = 1

[default_session]
command = "/usr/bin/dashi-greeter"
user = "greetd"
