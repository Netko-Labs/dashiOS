# Anaconda on Dashi's live image. Its web UI opens in a browser: Fedora's
# default is slitherer (a Qt WebEngine runner) or Firefox; Dashi's browser is
# Helium, so the installer opens in Helium as an app window (the script gives
# it a throwaway profile). conf.d is read after the os-release profile.
[User Interface]
webui_web_engine = /usr/libexec/dashi/installer-browser
