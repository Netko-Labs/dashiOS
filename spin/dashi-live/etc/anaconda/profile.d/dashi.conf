# Anaconda's profile for Dashi (os-release ID=dashi). Without it no profile
# matches and Anaconda falls back to its generic defaults, which put the
# bootloader in the wrong EFI directory; Dashi is Fedora underneath, so it
# takes Fedora's profile (EFI dir, Btrfs with zstd, mirrors) and changes only
# what the installer shows.
#
# The installer creates the person's account (the accounts page stays, unlike
# Fedora Workstation's, whose first-boot setup makes it). Dashi's Setup
# Assistant does the rest at first login: language, keyboard, time zone,
# network, appearance, and the optional extras. Date and time are left to it.

[Profile]
profile_id = dashi
base_profile = fedora

[Profile Detection]
os_id = dashi

[Bootloader]
efi_dir = fedora
menu_auto_hide = True

[User Interface]
hidden_spokes =
    NetworkSpoke
hidden_webui_pages =
    anaconda-screen-date-time
