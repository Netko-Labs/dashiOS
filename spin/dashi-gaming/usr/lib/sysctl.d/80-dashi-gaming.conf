# dashi-gaming: only what Fedora 44 and the CachyOS kernel do not already set.
# Not here, because it is already right: esync's open-file limit (systemd's
# default hard limit is 524288, and Wine raises its soft limit to it).

# Memory map areas a process may have. Fedora sets 1048576
# (systemd-udev's 10-map-count.conf), enough for most games; SteamOS, which
# Proton games are tested on, uses 2147483642, and the games that run out of
# map areas run out on the lower value first. It is a ceiling, not memory
# taken. This file sorts after 10-map-count.conf, so it wins.
vm.max_map_count = 2147483642

# A split lock (an atomic operation across two cache lines) makes the kernel
# pause the offending thread for ~10 ms on CPUs that detect them (recent
# Intel ones); some games built for Windows do it constantly, and their
# frame rate collapses. Neither Fedora nor the CachyOS kernel changes the
# default (1); SteamOS sets 0. The warning still lands in the kernel log.
# The leading "-" ignores CPUs and kernels without the setting.
-kernel.split_lock_mitigate = 0
