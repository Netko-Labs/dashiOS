# dashi-nvidia: NVIDIA's driver gets the first try at NVIDIA GPUs.
#
# nouveau and nova_core match every NVIDIA card, nvidia (RPM Fusion's open
# kernel modules) the ones it supports (Turing and newer). Loading either of
# the first two loads nvidia before it, so nvidia takes the cards it can
# drive and nouveau keeps the older ones. If nvidia cannot load (Secure Boot
# refuses the unsigned module), the failure is ignored and nouveau runs the
# card, so the machine still boots. RPM Fusion's own way, blacklisting
# nouveau on the kernel command line, leaves those cards with no driver.
install nouveau /sbin/modprobe --ignore-install nvidia >/dev/null 2>&1; /sbin/modprobe --ignore-install nouveau $CMDLINE_OPTS
install nova_core /sbin/modprobe --ignore-install nvidia >/dev/null 2>&1; /sbin/modprobe --ignore-install nova_core $CMDLINE_OPTS
