# Dashi: a user unit (an app's scope) gets 10 s to stop at logout or
# shutdown, then it is killed. A process stuck in a driver (a graphics card
# that fell off the bus) can't be killed at all; waiting the default 90 s for
# it only delays the restart that fixes it. The shell already gave the apps
# 10 s of its own (packages/shell/src/shutdown.ts).
[Manager]
DefaultTimeoutStopSec=10s
