# Anaconda's profile for Dashi. Anaconda picks a profile by the os-release ID
# (dashi-release says ID=dashi); with no match it would fall back to its
# generic defaults and, among other things, put the boot loader in the wrong
# EFI folder. Dashi installs like Fedora, so everything comes from Fedora's
# profile (fedora.conf: btrfs, the EFI folder shim and GRUB use, the update
# repositories); the installer's browser is set for the live image in
# conf.d/90-dashi.conf (dashi-live).
#
# The installer creates the person's account (its accounts page stays, unlike
# Fedora Workstation's, whose first-boot setup makes it); Dashi's Setup
# Assistant does the rest at first login, date and time included.
[Profile]
profile_id = dashi
base_profile = fedora

[Profile Detection]
os_id = dashi

[User Interface]
hidden_webui_pages =
    anaconda-screen-date-time
