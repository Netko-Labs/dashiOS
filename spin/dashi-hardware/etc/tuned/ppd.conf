# tuned-ppd: map the power-profiles-daemon profiles Dashi's shell asks for to
# Dashi's thin tuned profiles (Dashi's mode recipe owns EPP, the platform
# profile, boost and the power limits; these profiles leave them alone).
[main]
default=balanced
# Dashi drives the mode from the power source itself (Automatic); tuned-ppd's
# own battery watching stays off so there is one decider.
battery_detection=false

[profiles]
power-saver=dashi-powersave
balanced=dashi-balanced
performance=dashi-performance
