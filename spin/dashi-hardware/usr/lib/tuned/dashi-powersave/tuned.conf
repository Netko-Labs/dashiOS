#
# Dashi power-saver profile. Deliberately thin: Dashi's mode recipe, through
# dashi-hardware, owns EPP, the platform profile, boost and the power limits
# (one writer per knob), so this profile must not touch them. It exists so
# tuned-ppd has a profile to switch to, and so ActiveProfile changes when the
# mode does. Non-conflicting, battery-friendly tweaks only.
#
[main]
summary=Dashi power saver (Dashi's recipe owns CPU power and the profile)

[audio]
timeout=10

[usb]
autosuspend=1

[disk]
# Spin media down sooner on battery; no effect on SSDs.
spindown=5
