#
# Dashi performance profile. Thin by design: Dashi's mode recipe owns EPP,
# the platform profile, boost and the power limits, so this profile leaves
# them alone. tuned-ppd maps Performance to it.
#
[main]
summary=Dashi performance (Dashi's recipe owns CPU power and the profile)

[disk]
# Keep media spun up under a performance mode.
spindown=0
