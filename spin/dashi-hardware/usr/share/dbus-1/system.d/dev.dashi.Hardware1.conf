<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- dashi-hardware owns dev.dashi.Hardware1 on the system bus; anyone may
     call it, and each method is guarded by its own polkit action. -->
<busconfig>
  <policy user="root">
    <allow own="dev.dashi.Hardware1"/>
  </policy>
  <policy context="default">
    <allow send_destination="dev.dashi.Hardware1"/>
    <allow receive_sender="dev.dashi.Hardware1"/>
  </policy>
</busconfig>
